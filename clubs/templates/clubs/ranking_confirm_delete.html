{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Konfirmasi Hapus Peringkat</h2>
  <p>
    Apakah Anda yakin ingin menghapus peringkat
    <strong>{{ ranking.club.nama }}</strong> untuk musim
    <strong>{{ ranking.musim }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Hapus</button>
    <a href="{% url 'club_detail' ranking.club.pk %}" class="btn btn-secondary"
      >Batal</a
    >
  </form>
</div>
{% endblock %}
