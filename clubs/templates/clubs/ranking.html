{% extends 'base.html' %} {% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Daftar Peringkat Klub</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Klub</th>
        <th>Musim</th>
        <th>Peringkat</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody>
      {% for ranking in rankings %}
      <tr>
        <td>
          <a href="{% url 'club_detail' ranking.club.pk %}"
            >{{ ranking.club.nama }}</a
          >
        </td>
        <td>{{ ranking.musim }}</td>
        <td>{{ ranking.peringkat }}</td>
        <td>
          <a
            href="{% url 'club_ranking_update' ranking.pk %}"
            class="btn btn-sm btn-info"
            >Edit</a
          >
          <a
            href="{% url 'club_ranking_delete' ranking.pk %}"
            class="btn btn-sm btn-danger"
            >Hapus</a
          >
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4">Belum ada data peringkat klub.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <a href="{% url 'club_list' %}" class="btn btn-secondary mt-3"
    >Kembali ke Daftar Klub</a
  >
</div>
{% endblock %}
