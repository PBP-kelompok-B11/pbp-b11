{% extends 'base.html' %} {% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Konfirmasi Hapus Klub</h2>
  <p>Anda yakin ingin menghapus klub "<strong>{{ club.nama }}</strong>"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Hapus</button>
    <a href="{% url 'club_detail' club.pk %}" class="btn btn-secondary"
      >Batal</a
    >
  </form>
</div>
{% endblock %}
