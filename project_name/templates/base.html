<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Beyond90 - Football Portal</title>

    <!-- Tailwind Play CDN for quick prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* small helper to emulate some of your figma layout feel */
      .btn-lime {
        @apply bg-lime-400 text-indigo-900 rounded-full px-4 py-2 font-semibold;
      }
      .card-glass {
        @apply bg-white/5 backdrop-blur-md rounded-3xl p-6;
      }
    </style>
  </head>
  <body class="bg-indigo-900 text-white min-h-screen">
    {% include "navbar.html" %}
    <main class="container mx-auto py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
