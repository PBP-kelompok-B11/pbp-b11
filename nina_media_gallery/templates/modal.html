<!-- Modal Overlay -->
<div id="crudModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-800 bg-opacity-50 transition-opacity duration-300">
  
  <!-- Modal Content -->
  <div id="crudModalContent" class="z-60 bg-white rounded-lg shadow-lg w-5/6 sm:w-3/5 md:w-1/2 lg:w-2/5 xl:w-1/3 max-h-screen overflow-y-auto opacity-0 scale-95 transition-all duration-300 pointer-events-auto">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between p-4 border-b">
      <h3 class="text-xl font-semibold text-gray-900">Upload Media</h3>
      <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5" onclick="hideModal()">
        <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
        </svg>
      </button>
    </div>
    
    <!-- Modal Body -->
    <div class="px-6 py-4 space-y-6">
      <form id="mediaForm">
        {% csrf_token %}
        <div class="mb-4">
          <label for="deskripsi" class="block text-sm font-medium text-gray-700">Deskripsi</label>
          <textarea id="deskripsi" name="deskripsi" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter description" required></textarea>
        </div>
        <div class="mb-4">
          <label for="thumbnailUrl" class="block text-sm font-medium text-gray-700">Media URL</label>
          <input type="url" id="thumbnailUrl" name="thumbnailUrl" class="mt-2 block w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="https://example.com/media.jpg" required>
        </div>
        <div class="mb-4">
          <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
          <select id="category" name="category" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
            <option value="">Choose a category</option>
            <option value="foto">Photo</option>
            <option value="video">Video</option>
          </select>
        </div>
      </form>
    </div>
    
    <!-- Modal Footer -->
    <div class="flex flex-col sm:flex-row gap-4 p-6 border-t border-gray-200 rounded-b">
      <button type="button" id="cancelButton" class="order-2 sm:order-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-md font-medium hover:bg-gray-50" onclick="hideModal()">Cancel</button>
      <button type="submit" id="submitButton" form="mediaForm" class="order-1 sm:order-2 flex-1 bg-blue-400 text-white px-6 py-3 rounded-md font-medium hover:bg-blue-500">Upload Media</button>
    </div>

  </div>
</div>

<script>
  const modal = document.getElementById('crudModal');
  const modalContent = document.getElementById('crudModalContent');
  const form = document.getElementById('mediaForm');

  function showModal() {
    modal.classList.remove('hidden');
    setTimeout(() => {
      modalContent.classList.remove('opacity-0','scale-95');
      modalContent.classList.add('opacity-100','scale-100');
    }, 50);
  }

  function hideModal() {
    modalContent.classList.remove('opacity-100','scale-100');
    modalContent.classList.add('opacity-0','scale-95');
    setTimeout(() => {
      modal.classList.add('hidden');
      form.reset();
    }, 150);
  }

  modal.addEventListener('click', (e) => {
    if (e.target === modal) hideModal();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    try {
      const response = await fetch("{% url 'nina_media_gallery:gallery_upload' %}", {
        method: "POST",
        credentials: "include",
        headers: { 'X-CSRFToken': csrftoken },
        body: formData
      });

      if (response.ok) {
        hideModal();
        document.dispatchEvent(new CustomEvent('mediaUploaded'));
        alert('Media uploaded successfully!');
      } else {
        const data = await response.json();
        alert(data.message || 'Upload failed!');
      }
    } catch (err) {
      console.error(err);
      alert('An error occurred while uploading.');
    }
  });
</script>
