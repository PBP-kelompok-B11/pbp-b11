{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-indigo-900 flex flex-col justify-center items-center py-12">

    <!-- Tombol buka modal -->
    <button onclick="openModal()" 
        class="text-white bg-lime-400 px-6 py-3 rounded-full font-semibold text-lg hover:bg-lime-300 transition">
        + Upload Media
    </button>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50 transition-opacity duration-300 ease-out">

        <!-- Konten Modal -->
        <div id="modalContent" class="bg-[#1E1BFF] w-11/12 md:w-1/2 p-10 rounded-xl shadow-2xl text-white transform scale-90 opacity-0 transition-all duration-300 ease-out relative">

            <!-- Tombol Close -->
            <button onclick="closeModal()" class="absolute top-4 right-6 text-white hover:text-gray-300 text-2xl">&times;</button>

            <!-- Judul -->
            <h1 class="text-5xl font-bold mb-8 tracking-wide">Upload Media</h1>

            <!-- Form Upload -->
            <form id="uploadForm" method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="space-y-6">
                    <!-- Deskripsi -->
                    <div>
                        <label class="block text-white mb-2 font-medium">Deskripsi</label>
                        <textarea name="deskripsi" required
                            class="w-full px-4 py-3 rounded-lg bg-transparent border border-white text-white focus:outline-none focus:border-lime-400" 
                            placeholder="Masukkan deskripsi media" rows="3"></textarea>
                    </div>

                    <!-- Kategori -->
                    <div>
                        <label class="block text-white mb-2 font-medium">Kategori</label>
                        <select name="category" id="category" required
                            class="w-full px-4 py-3 rounded-full bg-indigo-800 border border-white text-white focus:outline-none focus:border-lime-400">
                            <option value="">Pilih Kategori</option>
                            <option value="foto">Photo</option>
                            <option value="video">Video</option>
                        </select>
                    </div>

                    <!-- Thumbnail -->
                    <div>
                        <label class="block text-white mb-2 font-medium">Thumbnail URL</label>
                        <input type="url" name="thumbnail" 
                            class="w-full px-4 py-3 rounded-full bg-transparent border border-white text-white focus:outline-none focus:border-lime-400"
                            placeholder="https://example.com/image.jpg">
                    </div>
                </div>

                <div class="text-center mt-10">
                    <button type="submit"
                        class="px-10 py-3 bg-lime-400 text-indigo-900 font-semibold rounded-full hover:bg-lime-300 transition">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50"></div>
</div>

<script>
/* ---- Modal Open / Close ---- */
function openModal() {
    const modal = document.getElementById('modal');
    const content = document.getElementById('modalContent');
    modal.classList.remove('hidden');
    setTimeout(() => {
        content.classList.remove('scale-90', 'opacity-0');
        content.classList.add('scale-100', 'opacity-100');
    }, 10);
}

function closeModal() {
    const modal = document.getElementById('modal');
    const content = document.getElementById('modalContent');
    content.classList.add('scale-90', 'opacity-0');
    content.classList.remove('scale-100', 'opacity-100');
    setTimeout(() => modal.classList.add('hidden'), 200);
}

/* ---- AJAX Upload ---- */
document.getElementById("uploadForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Validasi kosong
    const deskripsi = this.querySelector('[name="deskripsi"]');
    const category = this.querySelector('[name="category"]');
    const thumbnail = this.querySelector('[name="thumbnail"]');
    
    let valid = true;
    
    // Validasi deskripsi (required)
    if (!deskripsi.value.trim()) {
        valid = false;
        deskripsi.classList.add("border-red-500");
    } else {
        deskripsi.classList.remove("border-red-500");
    }
    
    // Validasi category (required)
    if (!category.value) {
        valid = false;
        category.classList.add("border-red-500");
    } else {
        category.classList.remove("border-red-500");
    }
    
    // Thumbnail adalah optional (blank=True, null=True)
    thumbnail.classList.remove("border-red-500");

    if (!valid) {
        showToast("⚠️ Mohon isi deskripsi dan pilih kategori!", "error");
        return;
    }

    // Debug: Log data sebelum kirim
    console.log("Deskripsi:", deskripsi.value);
    console.log("Category:", category.value);
    console.log("Thumbnail:", thumbnail.value);

    let formData = new FormData(this);
    
    // Debug: Log FormData
    for (let pair of formData.entries()) {
        console.log(pair[0] + ': ' + pair[1]);
    }

    fetch("{% url 'nina_media_gallery:gallery_upload' %}", {
        method: "POST",
        headers: { "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value },
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        console.log("Response:", data);
        if (data.status === "success") {
            showToast("✅ Upload berhasil!", "success");
            setTimeout(() => {
                closeModal();
                window.location.href = "{% url 'nina_media_gallery:gallery_list' %}";
            }, 2000);
        } else {
            showToast("❌ " + (data.message || "Upload gagal!"), "error");
        }
    })
    .catch((error) => {
        console.error("Error:", error);
        showToast("❌ Terjadi kesalahan server!", "error");
    });
});

/* ---- Toast Notification ---- */
function showToast(message, type = "success") {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");

    toast.className = `
        mb-3 px-6 py-3 rounded-lg shadow-lg text-white transition-opacity duration-500 opacity-0
        ${type === "success" ? "bg-green-500" : "bg-red-500"}
    `;
    toast.textContent = message;

    container.appendChild(toast);
    setTimeout(() => toast.classList.add("opacity-100"), 50);
    setTimeout(() => {
        toast.classList.remove("opacity-100");
        setTimeout(() => toast.remove(), 500);
    }, 2500);
}
</script>
{% endblock %}
