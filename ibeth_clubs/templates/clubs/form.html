{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white/5 p-8 rounded-3xl">
  <h2 class="text-3xl font-bold mb-4 text-white">{{ title|default:"Form" }}</h2>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block text-sm text-lime-400 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-red-400 text-sm">{{ field.errors }}</p>
        {% endif %}
      </div>
    {% endfor %}

    <div class="flex gap-3 mt-4">
      <button type="submit" class="btn-lime">Submit</button>
      <a href="{% url 'club_list' %}" class="px-4 py-2 rounded bg-white/10">Batal</a>
    </div>
  </form>
</div>
{% endblock %}
