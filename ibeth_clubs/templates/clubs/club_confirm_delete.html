{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto bg-white/5 p-6 rounded-2xl">
  <h2 class="text-2xl font-semibold mb-4">Konfirmasi Hapus Klub</h2>
  <p>Anda yakin ingin menghapus klub <strong>{{ club.nama }}</strong>?</p>
  <form method="post" class="mt-4">
    {% csrf_token %}
    <button type="submit" class="px-4 py-2 rounded bg-red-600 text-white hover:bg-red-700">
      Hapus
    </button>
    <a href="{% url 'ibeth_clubs:club_list' %}" class="px-4 py-2 rounded bg-white/10 hover:bg-white/20">
      Batal
    </a>
  </form>
</div>
{% endblock %}
