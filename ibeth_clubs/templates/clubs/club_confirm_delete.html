{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-indigo-900 flex items-center justify-center text-white relative overflow-hidden">

  <!-- Dekorasi teks besar -->
  <div class="absolute text-[160px] font-bold text-white opacity-10 left-[-30px] top-[100px] select-none pointer-events-none">
    DELETE
  </div>

  <!-- Panah dekorasi -->
  <div class="absolute left-[-10px] top-[180px] w-[220px] h-[380px]">
    <svg viewBox="0 0 444 517" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
      <path d="M403.493 320.269C325.455 558.021 117.482 533.718 86.0948 436.53C56.6724 345.426 149.839 278.662 212.786 274.763C272.671 271.053 282.789 322.371 231.247 339.316C124.051 374.558 -75.0639 213.756 -7.92073 3.03597M403.493 320.269L325.1 360.136M403.493 320.269L433.788 397.871" 
            stroke="#B0FE08" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Kontainer utama -->
  <div class="relative bg-indigo-800/60 backdrop-blur-lg border border-white/10 rounded-3xl shadow-xl px-10 py-12 w-[500px] text-center z-10">
    <h2 class="text-4xl font-['League_Gothic'] tracking-widest mb-6 text-lime-400">DELETE CLUB</h2>
    <p class="text-lime/80 text-lg mb-8">
      Are you sure you want to delete <span class="font-semibold text-lime">{{ club.nama }}</span>?
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="flex justify-center gap-4">
        <button type="submit"
                class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-full font-semibold transition">
          Delete
        </button>
        <a href="{% url 'ibeth_clubs:club_list' %}"
           class="bg-white/10 hover:bg-white/20 px-6 py-2 rounded-full font-semibold transition">
          Cancel
        </a>
      </div>
    </form>
  </div>

  <!-- Footer lime -->
  <div class="absolute bottom-0 left-0 w-full h-12 bg-lime-400"></div>
</div>
{% endblock %}
