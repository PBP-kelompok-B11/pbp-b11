{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-indigo-900 text-white pt-32 relative overflow-hidden">

  <!-- Dekorasi teks besar -->
  <div class="absolute text-[220px] font-bold text-white opacity-10 left-[-50px] top-[120px] select-none pointer-events-none">
    CLUB
  </div>

  <!-- Panah dekorasi -->
<div class="absolute left-[-10px] top-[200px] w-[300px] h-[540px]">
  <svg viewBox="0 0 444 517" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
    <path d="M403.493 320.269C325.455 558.021 117.482 533.718 86.0948 436.53C56.6724 345.426 149.839 278.662 212.786 274.763C272.671 271.053 282.789 322.371 231.247 339.316C124.051 374.558 -75.0639 213.756 -7.92073 3.03597M403.493 320.269L325.1 360.136M403.493 320.269L433.788 397.871" 
          stroke="#B0FE08" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>


  <!-- Bagian konten utama -->
  <div class="relative z-10 flex flex-col lg:flex-row justify-between items-start px-12 lg:px-24">

    <!-- Kiri -->
    <div class="max-w-md space-y-2 mt-10">
      <div class="text-left text-white text-[180px] font-normal font-['League_Gothic'] leading-none">
        CLUB
      </div>
      <p class="text-[16px] text-white/52">
        Discover more than 100 football clubs around the globe!
      </p>
      <a href="{% url 'ibeth_clubs:club_create' %}" 
        class="inline-block bg-lime-400 text-indigo-900 font-semibold px-8 py-3 rounded-full hover:bg-lime-300 transition">
        Add Club
      </a>
    </div>


    <!-- Kanan -->
    <div class="mt-16 lg:mt-0 lg:ml-10 bg-white rounded-[38px] p-[10px]">
      <div class="bg-indigo-900 rounded-[28px] p-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
        {% for club in clubs %}
        <div class="relative">
          <div class="absolute inset-0 bg-lime-400 rounded-2xl translate-x-[4px] translate-y-[4px]"></div>
          <div class="relative bg-indigo-900 rounded-2xl p-4">
            <img src="https://placehold.co/291x291" alt="logo" class="w-full h-40 object-cover rounded-xl mb-3">
            <h3 class="text-lg font-semibold">{{ club.nama }}</h3>
            <p class="text-sm text-white/70">{{ club.negara }}</p>
            <div class="mt-3 flex flex-wrap gap-2">
              <a href="{% url 'ibeth_clubs:club_detail' club.pk %}" class="px-3 py-1 rounded bg-white/10 hover:bg-white/20">Detail</a>
              <a href="{% url 'ibeth_clubs:club_update' club.pk %}" class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-700">Edit</a>
              <a href="{% url 'ibeth_clubs:club_delete' club.pk %}" class="px-3 py-1 rounded bg-red-600 hover:bg-red-700">Hapus</a>
            </div>
          </div>
        </div>
        {% empty %}
        <div class="col-span-full text-center py-40 bg-indigo-900/20 rounded-2xl border border-white/20">
          <p class="text-3xl font-semibold text-white/90">Belum ada klub terdaftar.</p>
        </div>
        {% endfor %}
      </div>
    </div>

  </div>

  <!-- Footer lime -->
  <div class="absolute bottom-0 left-0 w-full h-16 bg-lime-400"></div>
</div>
{% endblock %}
