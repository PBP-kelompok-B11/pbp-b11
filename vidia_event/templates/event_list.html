{% extends 'base.html' %} 
{% load static %} 
{% block content %}

<!-- Biar halaman utama fix dan nggak bisa discroll -->
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* ⛔ Cegah scroll global */
  }
</style>

<div class="relative w-screen h-screen overflow-hidden bg-indigo-900">
  <!-- Judul -->
  <div class="absolute top-[175px] left-[100px] h-36 w-[574px] font-['League_Gothic'] text-8xl font-normal text-white">
    COMPETITION
  </div>

  <!-- Area utama (kanan) -->
  <div class="absolute top-[84px] left-[500px] h-[721px] w-[900px] overflow-hidden">
    <!-- Background boxes -->
    <div class="absolute top-[50px] left-[-1px] h-[625px] w-[901px] rounded-[38px] bg-white"></div>
    <div class="absolute top-[64px] left-[17px] h-[595px] w-[868px] rounded-3xl bg-indigo-900"></div>
  <style>
  /* Scrollbar untuk Webkit (Chrome, Safari) */
  .scrollbar-custom::-webkit-scrollbar {
    width: 10px;             /* Lebar scrollbar */
  }

  .scrollbar-custom::-webkit-scrollbar-track {
    background: #4F46E5;     /* Warna track (indigo) */
    border-radius: 8px;
  }

  .scrollbar-custom::-webkit-scrollbar-thumb {
    background-color: #B0FE08; /* Warna thumb (lime) */
    border-radius: 8px;
    border: 2px solid #4F46E5; /* Biar ada padding di track */
  }

  /* Firefox */
  .scrollbar-custom {
    scrollbar-width: thin;
    scrollbar-color: #B0FE08 #4F46E5;
  }
  </style>

    <!-- Container utama scrollable -->
    <div class="absolute top-[75px] left-[28px] w-[855px] h-[572px] overflow-y-auto overflow-x-hidden rounded-2xl bg-indigo-900 p-2 scrollbar-custom">
      {% if page_obj %}
        {% for event in page_obj %}
          <a href="{% url 'vidia_event:event_detail' event.pk %}" class="block relative h-28 w-full mb-4 group transition">
            <div class="absolute top-0 left-0 h-28 w-full rounded-2xl bg-lime-400 group-hover:bg-lime-300 transition"></div>
            <div class="absolute top-[20px] right-[15px] h-20 w-60 rounded-2xl bg-indigo-900"></div>
            <div class="absolute top-[26px] left-[39px] w-[563px] font-['Geologica'] text-5xl leading-[62.5px] font-normal text-indigo-900">
              {{ event.nama_event }}
            </div>
            <div class="absolute top-[26px] right-[80px] w-24 font-['Geologica'] text-5xl leading-[62.5px] font-semibold text-white">
              0 - 1
            </div>
          </a>
        {% endfor %}
      {% else %}
        <p class="text-center text-gray-400 mt-60">No competitions yet.</p>
      {% endif %}
    </div>

    <!-- PAGINATION BUTTONS -->

  </div>

  <!-- Deskripsi kiri -->
  <div class="absolute top-[342px] left-[100px] w-96 justify-center font-['Geologica'] text-xl leading-normal font-normal text-white">
    Discover more than 100 competition around the globe!
  </div>

  <!-- Tombol Add Competition -->
  <a href="{% url 'vidia_event:event_create' %}" class="absolute top-[417px] left-[100px] h-12 w-60 cursor-pointer z-50">
    <div class="relative h-full w-full overflow-hidden rounded-[36px] bg-lime-400 transition hover:bg-lime-300 flex items-center justify-center">
      <span class="font-['Geologica'] text-2xl leading-10 font-normal text-indigo-900">
        Add Competition
      </span>
    </div>
  </a>

  <!-- SVG background kiri -->
  <div class="absolute left-[-10px] top-[380px] w-[220px] h-[380px]">
    <svg viewBox="0 0 444 517" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
      <path d="M403.493 320.269C325.455 558.021 117.482 533.718 86.0948 436.53C56.6724 345.426 149.839 278.662 212.786 274.763C272.671 271.053 282.789 322.371 231.247 339.316C124.051 374.558 -75.0639 213.756 -7.92073 3.03597M403.493 320.269L325.1 360.136M403.493 320.269L433.788 397.871" 
            stroke="#B0FE08" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

{% endblock %}
