<!-- templates/events_form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Event</title>
  <style>
    body { font-family: Arial; background: #fafafa; padding: 20px; }
    form { background: white; padding: 20px; border-radius: 10px; width: 400px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #28a745; color: white; padding: 8px 12px; border: none; border-radius: 6px; margin-top: 10px; }
    button:hover { background: #218838; }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Simpan</button>
  </form>
  <br>
  <a href="{% url 'vidia_event:event_list' %}">← Kembali</a>
</body>
</html>
