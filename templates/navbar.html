<style>
  
  </style>

<nav class="fixed top-0 left-0 w-full bg-[#1A1B99] shadow-md z-50 border-b-4 border-[#C3FF00]">
  <div class="max-w-7xl mx-auto px-8">
    <div class="flex justify-between items-center h-20">

      <!-- Logo PBP 11 -->
      <div class="flex items-center space-x-0">
        <span class="bg-[#C3FF00] text-[#1A1B99] text-2xl font-bold border-2 border-[#C3FF00] px-5 py-2 rounded-l-full">
          PBP
        </span>
        <span class="text-[#C3FF00] text-2xl font-bold border-2 border-[#C3FF00] px-5 py-2 rounded-r-full">
          11
        </span>
      </div>

      <!-- Menu Navigasi -->
      <div class="hidden md:flex items-center space-x-14">
        <a href="{% url 'rafi_player:player_list' %}" class="text-white text-xl font-normal hover:text-[#C3FF00] transition">
          Player
        </a>
        <a href="{% url 'ibeth_clubs:club_list' %}" class="text-white text-xl font-normal hover:text-[#C3FF00] transition">
          Club
        </a>
        <a href="{% url 'vidia_event:event_list' %}" class="text-white text-xl font-normal hover:text-[#C3FF00] transition">
          Events
        </a>
        <a href="{% url 'authentication:home_view' %}" class="text-white text-xl font-normal hover:text-[#C3FF00] transition">
          Home
        </a>
      </div>

      <!-- Tombol Login -->
      <div class="hidden md:flex items-center">
        {% if user.is_authenticated %}
          <span class="text-white mr-6">{{ user.username }}</span>
          <a href="{% url 'authentication:logout_view' %}" class="bg-red-500 hover:bg-red-600 text-white font-medium px-5 py-2 rounded-full">
            Logout
          </a>
        {% else %}
          <a href="{% url 'authentication:login_view' %}" class="bg-[#C3FF00] text-[#1A1B99] hover:bg-[#adff00] font-medium px-8 py-2 rounded-full text-lg transition">
            Login
          </a>
        {% endif %}
      </div>

      <!-- Mobile Button -->
      <button class="md:hidden block text-white focus:outline-none mobile-menu-button">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

    </div>
  </div>

  <!-- Mobile Nav -->
  <div class="mobile-menu hidden bg-[#1A1B99] border-t border-[#C3FF00]">
    <div class="px-6 py-4 space-y-4 text-center">
      <a href="{% url 'rafi_player:player_list' %}" class="block text-white hover:text-[#C3FF00]">
        Player
      </a>
      <a href="{% url 'ibeth_clubs:club_list' %}" class="block text-white hover:text-[#C3FF00]">
        Club
      </a>
      <a href="{% url 'authentication:home_view' %}" class="block text-white hover:text-[#C3FF00]">
        Home
      </a>

      {% if user.is_authenticated %}
      <p class="text-white">{{ user.username }}</p>
      <a href="{% url 'authentication:logout_view' %}" class="block bg-red-500 text-white py-2 rounded-full mt-3">
        Logout
      </a>
      {% else %}
      <a href="{% url 'authentication:login_view' %}" class="block bg-[#C3FF00] text-[#1A1B99] py-2 rounded-full font-medium mt-3">
        Login
      </a>
      {% endif %}
    </div>
  </div>

  <script>
    const btn = document.querySelector(".mobile-menu-button");
    const menu = document.querySelector(".mobile-menu");

    btn.addEventListener("click", () => {
      menu.classList.toggle("hidden");
    });
  </script>
</nav>
