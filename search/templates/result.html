{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Search</h2>

  <form id="search-form" method="GET">
    <div class="input-group mb-3">
      <input type="text" id="search-input" name="q" class="form-control" placeholder="Search players or clubs...">
      <button class="btn btn-primary" type="submit">Search</button>
    </div>
  </form>
</div>

<script>
document.querySelector("#search-form").addEventListener("submit", function(e) {
  e.preventDefault();
  const query = document.querySelector("#search-input").value.trim().toLowerCase();

  // Deteksi berdasarkan keyword
  if (query.includes("club") || query.includes("fc") || query.includes("united") || query.includes("city")) {
    // redirect ke club_list
    window.location.href = "{% url 'club_list' %}?search=" + encodeURIComponent(query);
  } else {
    // default ke player_list
    window.location.href = "{% url 'player_list' %}?search=" + encodeURIComponent(query);
  }
});
</script>
{% endblock %}
