
<!-- tombol buka modal -->
<button id="openFilter" 
  style="background-color:#A7D129; color:#120C7A; font-weight:bold; padding:8px 16px; border:none; border-radius:25px; cursor:pointer; margin-left:10px;">
  Filter
</button>

<!-- modal -->
<div id="filterModal" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:100;">
  
  <div style="
    background-color:#120C7A;
    color:white;
    width:90%;
    max-width:400px;
    border-radius:20px;
    padding:24px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    text-align:left;
  ">
    <h2 style="margin-top:0; font-weight:700; text-align:center;">Filter Event ⚽</h2>
    <hr style="border:0; border-top:1px solid rgba(255,255,255,0.2); margin:12px 0;">

    <label>Tipe Event</label><br>
    <select id="filterTipe" style="width:100%; margin-bottom:12px; padding:8px 12px; border:none; border-radius:25px; outline:none;">
      <option value="">Semua</option>
      <option value="liga">Liga</option>
      <option value="turnamen">Turnamen</option>
      <option value="pertandingan">Pertandingan</option>
    </select>

    <label>Lokasi</label><br>
    <input id="filterLokasi" type="text" placeholder="Masukkan lokasi"
      style="width:100%; margin-bottom:12px; padding:8px 12px; border:none; border-radius:25px; outline:none;">

    <label>Tanggal Mulai</label><br>
    <input id="filterMulai" type="date"
      style="width:100%; margin-bottom:12px; padding:8px 12px; border:none; border-radius:25px; outline:none;">

    <label>Tanggal Selesai</label><br>
    <input id="filterSelesai" type="date"
      style="width:100%; margin-bottom:20px; padding:8px 12px; border:none; border-radius:25px; outline:none;">

    <div style="display:flex; justify-content:space-between;">
      <button id="resetFilter" style="background-color:#D6D6D6; color:#120C7A; border:none; border-radius:25px; padding:8px 16px; font-weight:bold; cursor:pointer;">
        Atur Ulang
      </button>
      <button id="applyFilter" style="background-color:#A7D129; color:#120C7A; border:none; border-radius:25px; padding:8px 16px; font-weight:bold; cursor:pointer;">
        Pakai
      </button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const openFilter = document.getElementById('openFilter');
  const filterModal = document.getElementById('filterModal');
  const applyFilter = document.getElementById('applyFilter');
  const resetFilter = document.getElementById('resetFilter');

  openFilter.addEventListener('click', () => filterModal.style.display = 'flex');
  filterModal.addEventListener('click', e => { if (e.target === filterModal) filterModal.style.display = 'none'; });

  resetFilter.addEventListener('click', () => {
    document.querySelectorAll('#filterModal input, #filterModal select').forEach(el => el.value = '');
  });

  applyFilter.addEventListener('click', () => {
    const params = new URLSearchParams({
      tipe: document.getElementById('filterTipe').value,
      lokasi: document.getElementById('filterLokasi').value,
      tanggal_mulai: document.getElementById('filterMulai').value,
      tanggal_selesai: document.getElementById('filterSelesai').value,
    });

    fetch(`/search/filter_events/?${params.toString()}`, {
      headers: {'X-Requested-With': 'XMLHttpRequest'}
    })
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById('eventContainer');
      if (!container) return;

      container.innerHTML = '';
      if (data.results.length === 0) {
        container.innerHTML = '<p style="color:#333;">Tidak ada event ditemukan.</p>';
      } else {
        data.results.forEach(e => {
          container.innerHTML += `
            <div class="card" style="background:white; color:#120C7A; border-radius:15px; padding:15px; margin-bottom:10px;">
              <div style="font-weight:bold;">${e.nama_event}</div>
              <div>${e.tanggal_mulai} — ${e.tanggal_selesai}</div>
              <div>${e.lokasi} • ${e.tipe}</div>
            </div>
          `;
        });
      }
      filterModal.style.display = 'none';
    });
  });
});
</script>
