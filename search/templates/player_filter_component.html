<!-- search/player_filter_component.html -->
<div id="playerFilterModal"
     class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
  <div class="bg-[#003366] text-white rounded-2xl p-6 w-96 shadow-xl border-2 border-lime-400">
    <h2 class="text-2xl font-bold text-lime-300 mb-4 text-center">⚙️ Filter Pemain</h2>

    <form id="playerFilterForm" class="space-y-4">
      <!-- Posisi -->
      <div>
        <label class="block text-sm font-semibold mb-1 text-lime-200">Posisi</label>
        <input type="text" name="posisi" placeholder="Contoh: Penyerang"
               class="w-full rounded-lg border border-lime-300 bg-white text-gray-900 px-3 py-2 focus:ring-2 focus:ring-lime-400 focus:outline-none">
      </div>

      <!-- Negara -->
      <div>
        <label class="block text-sm font-semibold mb-1 text-lime-200">Negara</label>
        <input type="text" name="negara" placeholder="Contoh: Argentina"
               class="w-full rounded-lg border border-lime-300 bg-white text-gray-900 px-3 py-2 focus:ring-2 focus:ring-lime-400 focus:outline-none">
      </div>

      <!-- Usia Minimal -->
      <div>
        <label class="block text-sm font-semibold mb-1 text-lime-200">Usia Minimal</label>
        <input type="number" name="usia_min" min="15" max="50"
               class="w-full rounded-lg border border-lime-300 bg-white text-gray-900 px-3 py-2 focus:ring-2 focus:ring-lime-400 focus:outline-none">
      </div>

      <!-- Usia Maksimal -->
      <div>
        <label class="block text-sm font-semibold mb-1 text-lime-200">Usia Maksimal</label>
        <input type="number" name="usia_max" min="15" max="50"
               class="w-full rounded-lg border border-lime-300 bg-white text-gray-900 px-3 py-2 focus:ring-2 focus:ring-lime-400 focus:outline-none">
      </div>

      <!-- Tombol -->
      <div class="flex justify-between mt-6">
        <button type="button" id="closePlayerFilterBtn"
                class="px-4 py-2 bg-gray-500 hover:bg-gray-600 rounded-lg">Tutup</button>
        <button type="submit"
                class="px-4 py-2 bg-lime-400 text-[#003366] font-semibold hover:bg-lime-300 rounded-lg">Terapkan</button>
      </div>
    </form>
  </div>
</div>

<!-- Tombol buka modal -->
<div class="fixed bottom-6 right-6">
  <button id="openPlayerFilterBtn"
          class="bg-lime-400 text-[#003366] font-bold py-2 px-4 rounded-full shadow-lg hover:bg-lime-300 transition">
    🔍 Filter Pemain
  </button>
</div>

<script>
  const playerFilterModal = document.getElementById("playerFilterModal");
  const openPlayerFilterBtn = document.getElementById("openPlayerFilterBtn");
  const closePlayerFilterBtn = document.getElementById("closePlayerFilterBtn");
  const playerFilterForm = document.getElementById("playerFilterForm");

  openPlayerFilterBtn.addEventListener("click", () => {
    playerFilterModal.classList.remove("hidden");
    playerFilterModal.classList.add("flex");
  });

  closePlayerFilterBtn.addEventListener("click", () => {
    playerFilterModal.classList.add("hidden");
    playerFilterModal.classList.remove("flex");
  });

  playerFilterForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(playerFilterForm);
    const params = new URLSearchParams(formData);

    const response = await fetch(`/search/filter_players/?${params}`, {
      headers: { "X-Requested-With": "XMLHttpRequest" }
    });
    const data = await response.json();

    // update hasil pemain di halaman
    const container = document.getElementById("player-list-container");
    if (container) {
      container.innerHTML = data.results.map(p => `
        <div class="bg-white p-4 rounded-xl shadow-md mb-4">
          <h3 class="text-lg font-semibold text-[#003366]">${p.nama}</h3>
          <p class="text-gray-600">⚽ ${p.posisi} | 🌍 ${p.negara}</p>
          <p class="text-sm text-gray-500">🎂 Usia: ${p.usia || '-'}</p>
        </div>
      `).join("");
    }

    playerFilterModal.classList.add("hidden");
    playerFilterModal.classList.remove("flex");
  });
</script>
