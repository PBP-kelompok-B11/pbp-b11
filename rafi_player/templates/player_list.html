{% extends 'base.html' %}
{% load static %}
{% block content %}
<head>
  
</head>
<body>

  <main>
    <section class="player-section">
        <div class="player-text mt-10">

            <div class="player-header">
            <h1>PLAYER</h1>
            <p>Discover more than 100 talented players around the globe!</p>
            </div>
            
            <!-- tombol tetap di atas -->
            {% if user.is_authenticated %}
                <button onclick="showPlayerModal()" class="add-btn">Add Player</button>

                <div class="flex space-x-2 mb-6">
                    <button id="filter-all" class="add-btn">Show All</button>
                    <button id="filter-my" class="add-btn">Show My</button>
                </div>

                
                <div class="mt-15 mb-6 flex items-center space-x-2">
                <select id="positionFilter" class="px-3 py-2 rounded-full bg-lime-400 text-black border-none outline-none shadow-sm">
                    <option value="all">Semua Posisi</option>
                    <option value="GK">GK (Penjaga Gawang)</option>
                    <option value="DF">DF (Bek)</option>
                    <option value="DFFW">DFFW (Bek / Penyerang)</option>
                    <option value="DFMF">DFMF (Bek / Gelandang)</option>
                    <option value="MF">MF (Gelandang)</option>
                    <option value="MFDF">MFDF (Gelandang / Bek)</option>
                    <option value="MFFW">MFFW (Gelandang / Penyerang)</option>
                    <option value="FW">FW (Penyerang)</option>
                    <option value="FWDF">FWDF (Penyerang / Bek)</option>
                    <option value="FWMF">FWMF (Penyerang / Gelandang)</option>
                </select>
            </div>

            {% else %}
            <!-- Jika belum login -->
            <a href="{% url 'authentication:login_view' %}" 
            class="add-btn">
                Add Player
            </a>

            {% endif %}

            <!-- judul dan deskripsi -->
           

        </div>

        

        <div class="player-grid-wrapper mt-20">
            <div id="grid" class="player-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 min-h-96 relative">
                
                <!-- TULISAN "No players found" DI DALAM GRID -->
                <div id="empty" class="hidden col-span-full flex items-center justify-center text-gray-500 text-lg font-medium h-96">
                    No players found.
                </div>

                <div id="loading" class="hidden col-span-full flex flex-col items-center justify-center h-96">
                    <svg class="animate-spin h-12 w-12 text-green-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                    </svg>
                    <p class="text-gray-400 text-lg font-medium">Loading players...</p>
                </div>

                        <!-- Error State -->
                <div id="error" class="hidden bg-red-100 text-red-700 p-4 rounded mt-10">
                    Error loading players!
                </div>

            </div>
        </div>

        
    </section>
  </main>

  <footer></footer>
</body>

<script>
    console.log("JS Loaded");
    const PLAYER_API_ENDPOINT = "{% url 'rafi_player:show_json_player' %}";
    const CURRENT_USER_ID = "{{ user.id|default_if_none:'' }}";

    console.log("Current user ID:", CURRENT_USER_ID);
    console.log("Tipe data CURRENT_USER_ID:", typeof CURRENT_USER_ID);

    

    // DOM Elements
    const loadingSpinner = document.getElementById('loading');
    const errorMessage = document.getElementById('error');
    const emptyStateDisplay = document.getElementById('empty');
    const playerGridContainer = document.getElementById('grid');
    const showAllPlayerButton = document.getElementById('filter-all');
    const showMyPlayerButton = document.getElementById('filter-my');

    // State Variables
    let activeFilter = 'all';
    let allPlayerData = [];

    // Update filter button appearance
    function updateFilterButtonsAppearance() {
    if (!showAllPlayerButton || !showMyPlayerButton) return;
    
    if (activeFilter === 'all') {
    showAllPlayerButton.className = 'filter-btn active';
    showMyPlayerButton.className = 'filter-btn';
    } else {
    showAllPlayerButton.className = 'filter-btn';
    showMyPlayerButton.className = 'filter-btn active';
    }
    }

    // Show/hide page sections
    function displayPageSection({ showLoading = false, showError = false, showEmpty = false, showGrid = false }) {
        // Sembunyikan semua dulu
        loadingSpinner.classList.add('hidden');
        errorMessage.classList.add('hidden');

        // Kosongkan grid
        playerGridContainer.innerHTML = '';

        if (showLoading) {
            // Tampilkan loading DI DALAM grid
            loadingSpinner.classList.remove('hidden');
            playerGridContainer.appendChild(loadingSpinner);
        } else if (showError) {
            errorMessage.classList.remove('hidden');
            playerGridContainer.appendChild(errorMessage);
        } else if (showEmpty || (showGrid && allPlayerData.length === 0)) { 
            const empty = document.createElement('div');
            empty.className = 'col-span-full flex flex-col items-center justify-center text-gray-500 h-96';
            empty.innerHTML = `
                <svg class="w-16 h-16 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-lg font-medium">No players found.</p>
                <p class="text-sm mt-1">Try changing the filter.</p>
            `;
            playerGridContainer.appendChild(empty);
        }

        // Pastikan grid terlihat
        playerGridContainer.classList.remove('hidden');
    }

    // Get readable category name
    // Get readable position name
    function getReadablePosition(posisiCode) {
        const posisiMapping = {
            "Penjaga Gawang": "Goalkeeper",
            "Bek": "Defender",
            "Gelandang": "Midfielder",
            "Striker": "Forward",
        };
        return posisiMapping[posisiCode] || posisiCode;
    }

    function buildPlayerCardElement(player) {


        const card = document.createElement('div');
        card.classList.add('player-card');
        card.style.position = 'relative';
        card.style.overflow = 'hidden';
        card.style.borderRadius = '12px'; // biar halus
        card.style.aspectRatio = '3 / 4'; // contoh rasio 3:4
        card.style.backgroundColor = '#222'; // fallback kalau thumbnail null

        card.addEventListener('click', () => {
            if (!CURRENT_USER_ID) {
                // User belum login, redirect ke login
                window.location.href = "{% url 'authentication:login_view' %}?next=" + encodeURIComponent(window.location.pathname);
            } else {
                // User sudah login, redirect ke detail player
                const detailUrl = `{% url 'rafi_player:player_detail' '00000000-0000-0000-0000-000000000000' %}`
                    .replace('00000000-0000-0000-0000-000000000000', player.id);
                window.location.href = detailUrl;
            }
        });


        // --- Thumbnail gambar ---
        const img = document.createElement('img');
        img.src = player.thumbnail || 'https://via.placeholder.com/300x400?text=No+Image';
        img.alt = player.nama;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.position = 'absolute';
        img.style.top = '0';
        img.style.left = '0';
        card.appendChild(img);

        // --- Overlay nama pemain ---
        const content = document.createElement('div');
        content.style.position = 'absolute';
        content.style.bottom = '0';
        content.style.width = '100%';
        content.style.background = 'linear-gradient(to top, rgba(0,0,0,0.7), transparent)';
        content.style.color = 'white';
        content.style.textAlign = 'center';
        content.style.fontWeight = '600';
        content.style.fontSize = '1rem';
        content.style.padding = '0.5rem';
        content.innerText = player.nama;

        card.appendChild(content);
        return card;
    }


        //////////////
    function renderAllPlayerCards(playerItems) {
        playerGridContainer.innerHTML = '';
        playerItems.forEach(playerItem => {
            const cardElement = buildPlayerCardElement(playerItem);
            playerGridContainer.appendChild(cardElement);
        });
    }

    // Filter and display player
    const positionFilterDropdown = document.getElementById('positionFilter');
    let activePositionFilter = 'all';

    if (positionFilterDropdown) {
        positionFilterDropdown.addEventListener('change', (e) => {
            activePositionFilter = e.target.value;
            filterAndDisplayPlayer();
        });
    }

    function filterAndDisplayPlayer() {
        updateFilterButtonsAppearance();

        let filteredPlayer = allPlayerData;

        // Filter "my" players
        if (activeFilter === 'my') {
            filteredPlayer = filteredPlayer.filter(player => Number(player.user_id) === Number(CURRENT_USER_ID));
        }

        // Filter berdasarkan posisi
        if (activePositionFilter !== 'all') {
            filteredPlayer = filteredPlayer.filter(player => player.posisi === activePositionFilter);
        }

        if (filteredPlayer.length === 0) {
            displayPageSection({ showEmpty: true });
        } else {
            displayPageSection({ showGrid: true });
            renderAllPlayerCards(filteredPlayer);
        }
    }

    // Fetch player data from server
    async function fetchPlayerFromServer() {
    try {
        displayPageSection({ showLoading: true });
        
        const response = await fetch(PLAYER_API_ENDPOINT, {
        headers: { 'Accept': 'application/json' },
        });

        if (!response.ok) {
        throw new Error('Failed to fetch player data from server');
        }

       
        const playerData = await response.json();
        allPlayerData = playerData || [];

         console.log("Data dari server:", playerData); // <--- ini penting
         console.log("Semua players:", allPlayerData);
        allPlayerData.forEach(player => {
            console.log(`Player ${player.nama} - user_id: ${player.user_id}`);
        });

        
        filterAndDisplayPlayer();

        
    } catch (error) {
        console.error('Error loading player:', error);
        displayPageSection({ showError: true });
    }
    }

    // Event handlers
    function handleShowAllPlayerClick() {
    activeFilter = 'all';
    filterAndDisplayPlayer();
    }

    function handleShowMyPlayerClick() {
    activeFilter = 'my';
    filterAndDisplayPlayer();
    }

    // Initialize page
    function initializePlayerPage() {
    if (showAllPlayerButton) {
        showAllPlayerButton.addEventListener('click', handleShowAllPlayerClick);
    }
    if (showMyPlayerButton) {
        showMyPlayerButton.addEventListener('click', handleShowMyPlayerClick);
    }

    fetchPlayerFromServer();
}


    // Start application
    initializePlayerPage();


    document.addEventListener('playerAdded', function() {
        fetchPlayerFromServer();
    });

    
</script>
{% endblock content %}
