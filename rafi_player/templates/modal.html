<!-- Modal -->
<div id="crudModal" class="hidden fixed inset-0 z-50 w-full flex items-center justify-center bg-gray-800 bg-opacity-50">
    <div id="crudModalContent" class="bg-blue-900 rounded-lg shadow-lg w-5/6 sm:w-3/5 md:w-1/2 lg:w-2/5 xl:w-1/3 max-h-screen overflow-y-auto">
      <!-- Modal header -->
      <div class="flex items-center justify-between p-4 border-b">
        <div>
          <h3 class="text-xl font-semibold text-white">
            Add New Player
          </h3>
          <p class="text-sm text-white mt-1">Share your football Player and stories with the community</p>
        </div>
        <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center" onclick="hideModal()">
          <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <!-- Modal body -->
      <div class="px-6 py-4 space-y-6 form-style">
        <form id="playerForm">
          <!-- Nama -->
          <div class="mb-4">
            <label for="nama" class="block text-sm font-medium text-white">Nama Pemain</label>
            <input type="text" id="nama" name="nama"
              class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-gray-900"
              placeholder="Masukkan nama pemain" required>
          </div>
  
          <!-- Negara -->
          <div class="mb-4">
            <label for="negara" class="block text-sm font-medium text-white">Negara</label>
            <input type="text" id="negara" name="negara"
              class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-gray-900"
              placeholder="Masukkan negara asal" required>
          </div>
  
          <!-- Usia -->
          <div class="mb-4">
            <label for="usia" class="block text-sm font-medium text-white">Usia</label>
            <input type="number" id="usia" name="usia"
              class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-gray-900"
              placeholder="Masukkan usia pemain" required>
          </div>
  
          <!-- Tinggi -->
          <div class="mb-4">
            <label for="tinggi" class="block text-sm font-medium text-white">Tinggi (cm)</label>
            <input type="number" step="0.1" id="tinggi" name="tinggi"
              class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-gray-900"
              placeholder="Masukkan tinggi pemain" required>
          </div>
  
          <!-- Berat -->
          <div class="mb-4">
            <label for="berat" class="block text-sm font-medium text-white">Berat (kg)</label>
            <input type="number" step="0.1" id="berat" name="berat"
              class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-gray-900"
              placeholder="Masukkan berat pemain" required>
          </div>
  
          <!-- Posisi -->
          <div class="mb-4">
            <label for="posisi" class="block text-sm font-medium text-white">Posisi</label>
            <select id="posisi" name="posisi"
              class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-gray-900" required>
              <option value="">Pilih posisi pemain</option>
              <option value="Penjaga Gawang">Penjaga Gawang</option>
              <option value="Bek">Bek</option>
              <option value="Gelandang">Gelandang</option>
              <option value="Striker">Striker</option>
            </select>
          </div>
  
          <!-- Thumbnail -->
          <div class="mb-4">
            <label for="thumbnail" class="block text-sm font-medium text-white">Foto</label>
            <input type="url" step="0.1" id="thumbnail" name="thumbnail"
              class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-gray-900"
              placeholder="Masukkan URL foto pemain" required>
          </div>
          <!-- <div class="mb-4">
            <div class="flex items-center">
              <input id="is_featured" name="is_featured" type="checkbox"
                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded">
              <label for="is_featured" class="ml-2 text-sm font-medium text-gray-900">
                Featured Player
              </label>
            </div>
          </div> -->
  
          <!-- Tombol Submit -->
          <div class="flex justify-end">
             <button type = submit class="add-btn">Submit</button>
          </div>
        </form>
  
      </div>
      <!-- Modal footer -->
      <!-- <div class="flex flex-col sm:flex-row gap-4 p-6 border-t border-gray-200 rounded-b">
        <button type="button" id="cancelButton" class="order-2 sm:order-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-md font-medium hover:bg-gray-50 transition-colors text-center" onclick="hideModal()">Cancel</button>
        <button type="submit" id="submitPlayer" form="playerForm" class="order-1 sm:order-2 flex-1 bg-green-600 text-white px-6 py-3 rounded-md font-medium hover:bg-green-700 transition-colors">Publish Player</button>
      </div> -->
    </div>
  </div>
  
  <script>
    function showModal() {
        const modal = document.getElementById('crudModal');
        const modalContent = document.getElementById('crudModalContent');
  
        modal.classList.remove('hidden'); 
        setTimeout(() => {
          modalContent.classList.remove('opacity-0', 'scale-95');
          modalContent.classList.add('opacity-100', 'scale-100');
        }, 50); 
    }
    
    function hideModal() {
        const modal = document.getElementById('crudModal');
        const modalContent = document.getElementById('crudModalContent');
  
        modalContent.classList.remove('opacity-100', 'scale-100');
        modalContent.classList.add('opacity-0', 'scale-95');
  
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 150); 
    }
  
     async function addPlayerEntry() {
      await fetch("{% url 'rafi_player:add_player_ajax' %}", {
        method: "POST",
        body: new FormData(document.querySelector('#playerForm')),
      })
  
      document.getElementById("playerForm").reset();
      hideModal();
        
      // Show toast notification
      showToast('Player added successfully!', '', 'success');
  
      // Dispatch custom event to notify main.html about new data
      document.dispatchEvent(new CustomEvent('playerAdded'));
  
      return false;
  
      }
  
      document.getElementById("playerForm").addEventListener("submit", function(e) {
      e.preventDefault();
      addPlayerEntry();
  })
    
  </script>
