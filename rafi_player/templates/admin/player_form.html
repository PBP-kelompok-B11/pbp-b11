{% extends "base.html" %}
{% block content %}
<div class="container mx-auto max-w-2xl py-10 px-6">
    <h2 class="text-3xl font-bold text-green-400 mb-6">
        {{ form.instance.id|yesno:"Edit Player,Tambah Player" }}
    </h2>

    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        {% for field in form %}
        <div>
            <label class="block text-gray-300 font-medium mb-2">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
                <p class="text-red-400 text-sm mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <div class="flex justify-between items-center pt-6">
            <button type="submit"
                    class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-lg shadow">
                Simpan
            </button>
            <a href="{% url 'rafi_player:admin_player_list' %}"
               class="bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-6 rounded-lg shadow">
                Batal
            </a>
        </div>
    </form>
</div>
{% endblock %}
