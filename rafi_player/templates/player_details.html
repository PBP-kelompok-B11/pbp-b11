{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="w-[1920px] h-[949px] relative overflow-hidden">
    <!-- 🖼️ Foto Pemain -->
      <div class="w-[484px] h-[587px] left-[98px] top-[138px] absolute">
        <div class="absolute inset-0 bg-lime-400 rounded-[46px]"></div>
        <div class="absolute inset-[14px] bg-indigo-900 rounded-[35px]"></div>
        <img id="player-image" 
             class="absolute inset-[30px] w-[420px] h-[525px] object-cover rounded-[35px] shadow-lg border-4 border-lime-400"
             src="https://placehold.co/420x525" 
             alt="Player Image" />
    </div>

    <!-- 🧠 Nama Pemain -->
    <div id="player-name"
        class="w-[989px] h-36 left-[180px] top-[117px] absolute text-right justify-center text-white text-9xl font-normal font-['League_Gothic'] tracking-wider uppercase">
        LOREM IPSUM
    </div>

    <!-- 🔹 Baris Atribut Utama -->
    <div class="absolute left-[657px] top-[300px] flex flex-row gap-[80px]">
        <!-- Negara -->
        <div class="flex flex-col items-start">
            <div class="text-lime-400 text-3xl font-bold font-['Geologica'] leading-[40px]">
                Country
            </div>
            <div id="player-country" class="text-white text-5xl font-semibold font-['Geologica'] leading-[55px]">
                Negara
            </div>
        </div>

        <!-- Posisi -->
        <div class="flex flex-col items-start">
            <div class="text-lime-400 text-3xl font-bold font-['Geologica'] leading-[40px]">
                Position
            </div>
            <div id="player-position" class="text-white text-5xl font-semibold font-['Geologica'] leading-[55px]">
                Posisi
            </div>
        </div>

        <!-- Usia -->
        <div class="flex flex-col items-start">
            <div class="text-lime-400 text-3xl font-bold font-['Geologica'] leading-[40px]">
                Age
            </div>
            <div id="player-age" class="text-white text-5xl font-semibold font-['Geologica'] leading-[55px]">
                Usia
            </div>
        </div>
    </div>

    <!-- 🔹 Baris Atribut Kedua -->
    <div class="absolute left-[657px] top-[470px] flex flex-row gap-[80px]">
        <!-- Tinggi -->
        <div class="flex flex-col items-start">
            <div class="text-lime-400 text-3xl font-bold font-['Geologica'] leading-[40px]">
                Height
            </div>
            <div id="player-height" class="text-white text-5xl font-semibold font-['Geologica'] leading-[55px]">
                -
            </div>
        </div>

        <!-- Berat -->
        <div class="flex flex-col items-start">
            <div class="text-lime-400 text-3xl font-bold font-['Geologica'] leading-[40px]">
                Weight
            </div>
            <div id="player-weight" class="text-white text-5xl font-semibold font-['Geologica'] leading-[55px]">
                -
            </div>
        </div>
    </div>

    <!-- Tombol / Aksi -->
    <div data-property-1="Frame 5099" class="w-[705px] h-14 left-[648px] top-[632px] absolute overflow-hidden">
        <div class="w-[695px] h-14 left-[5px] top-[3px] absolute bg-white rounded-3xl"></div>
        <div class="w-36 h-9 left-[279px] top-[11px] absolute justify-center text-indigo-900 text-xl font-normal font-['Geologica'] leading-6">
            Add Comment
        </div>
    </div>

    <p>DEBUG Player ID: {{ player_id }}</p>
</div>

<script>
const PLAYER_ID = "{{ player_id }}";
console.log("Player ID:", PLAYER_ID);

const PLAYER_DETAIL_ENDPOINT = `{% url 'rafi_player:show_json_player_by_id' '00000000-0000-0000-0000-000000000000' %}`
    .replace('00000000-0000-0000-0000-000000000000', PLAYER_ID);

const playerName = document.getElementById('player-name');
const playerCountry = document.getElementById('player-country');
const playerPosition = document.getElementById('player-position');
const playerAge = document.getElementById('player-age');
const playerHeight = document.getElementById('player-height');
const playerWeight = document.getElementById('player-weight');
const playerImage = document.getElementById('player-image');

async function loadPlayerDetail() {
    try {
        const response = await fetch(PLAYER_DETAIL_ENDPOINT, { headers: { 'Accept': 'application/json' } });
        if (!response.ok) throw new Error('Gagal ambil data');
        const player = await response.json();

        playerName.textContent = (player.nama || 'Unknown Player').toUpperCase();
        playerCountry.textContent = player.negara || '-';
        playerPosition.textContent = player.posisi || '-';
        playerAge.textContent = player.usia ? `${player.usia} tahun` : '-';
        playerHeight.textContent = player.tinggi ? `${player.tinggi} cm` : '-';
        playerWeight.textContent = player.berat ? `${player.berat} kg` : '-';

        playerImage.src = player.thumbnail
            ? (player.thumbnail.startsWith('http')
                ? player.thumbnail
                : `${window.location.origin}${player.thumbnail}`)
            : 'https://placehold.co/587x587';

        document.title = `${player.nama} - Player Detail`;
    } catch (err) {
        console.error('Error:', err);
    }
}

loadPlayerDetail();
</script>

{% endblock content %}
