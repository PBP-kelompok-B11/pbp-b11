{% extends 'base.html' %}
{% load static %}

{% block title %}Login | Beyond90{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Geologica:wght@400;600&display=swap" rel="stylesheet">

<div class="relative min-h-screen bg-indigo-900 flex flex-col items-center justify-center overflow-hidden">

  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute text-white font-[League_Gothic] text-[22vw] md:text-[10vw] opacity-10 left-1/2 -translate-x-1/2 top-[5%] select-none tracking-widest">
      BEYOND
    </div>
    <div class="hidden md:block absolute left-[10%] top-[20%] w-40 h-40 rotate-[24deg] outline outline-[6px] outline-offset-[-3px] outline-lime-400"></div>
    <div class="hidden md:block absolute right-[10%] bottom-[25%] w-36 h-24 rotate-180 outline outline-[5px] outline-offset-[-2px] outline-lime-400"></div>
  </div>

  <div class="absolute inset-0 bg-black/40"></div>

  <div class="relative w-[85%] max-w-[600px] bg-indigo-900/90 backdrop-blur-md rounded-xl p-6 md:p-8 flex flex-col items-center shadow-xl border border-lime-400/30 z-10">
    <h1 class="text-[14vw] md:text-[70px] font-[League_Gothic] text-white mb-6 tracking-wider leading-none">LOGIN</h1>

    <form id="loginForm" method="POST" class="w-full">
      {% csrf_token %}

      <div class="mb-5">
        <label class="block text-lime-400 text-base md:text-lg font-[Geologica] mb-1">Username</label>
        <input type="text" name="username" required
               class="w-full h-11 bg-indigo-900 border-2 border-lime-400 rounded-full text-white px-5 text-base md:text-lg focus:outline-none focus:ring-2 focus:ring-lime-300">
      </div>

      <div class="mb-5">
        <label class="block text-lime-400 text-base md:text-lg font-[Geologica] mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full h-11 bg-indigo-900 border-2 border-lime-400 rounded-full text-white px-5 text-base md:text-lg focus:outline-none focus:ring-2 focus:ring-lime-300">
      </div>

      <button type="submit"
              class="w-full bg-lime-400 text-indigo-900 text-lg md:text-xl font-[Geologica] py-2.5 rounded-full hover:scale-105 transition-transform duration-200">
        Login
      </button>

      <p class="mt-5 text-center text-lime-400 text-sm md:text-base font-[Geologica]">
        Belum punya akun?
        <a href="{% url 'authentication:register_view' %}" class="underline hover:text-lime-300 transition-colors duration-200">
          Register di sini
        </a>
      </p>
    </form>
  </div>

  <div class="absolute bottom-0 left-0 w-full h-14 md:h-16 bg-lime-400"></div>
</div>

<script>
document.querySelector("#loginForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);

  try {
    const response = await fetch("{% url 'authentication:login_view' %}", {
      method: "POST",
      headers: {
        "X-Requested-With": "XMLHttpRequest",
        "X-CSRFToken": formData.get("csrfmiddlewaretoken"),
      },
      body: formData
    });

    const data = await response.json();

    if (data.success) {
      Swal.fire({
        icon: 'success',
        title: 'Login Berhasil 🎉',
        text: data.message,
        confirmButtonColor: '#84cc16',
        background: '#1e1b4b',
        color: '#fff',
      }).then(() => {
        window.location.href = data.redirect_url;
      });
    } else {
      Swal.fire({
        icon: 'error',
        title: 'Login Gagal',
        text: data.message,
        confirmButtonColor: '#84cc16',
        background: '#1e1b4b',
        color: '#fff',
      });
    }
  } catch (error) {
    Swal.fire({
      icon: 'error',
      title: 'Oops!',
      text: 'Terjadi kesalahan. Coba lagi nanti.',
      confirmButtonColor: '#84cc16',
      background: '#1e1b4b',
      color: '#fff',
    });
  }
});
</script>
{% endblock %}
