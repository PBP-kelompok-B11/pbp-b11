{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Beyond90</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: 'Geologica', sans-serif;
    }
  </style>
</head>
<body class="bg-indigo-900 text-white overflow-x-hidden">

  <!-- Navbar -->
  <nav class="flex justify-between items-center px-6 md:px-16 py-6 border-b border-lime-400 bg-indigo-900 sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="flex items-center border-2 border-lime-400 rounded-full px-4 py-1">
        <span class="text-blue-700 text-2xl md:text-3xl font-[Konkhmer_Sleokchher]">PBP</span>
        <span class="text-lime-400 text-2xl md:text-3xl font-[Konkhmer_Sleokchher] ml-1">11</span>
      </div>
    </div>
    <div class="hidden md:flex items-center space-x-8 text-lg">
      <a href="#" class="hover:text-lime-400 transition">Player</a>
      <a href="#" class="hover:text-lime-400 transition">Club</a>
      <a href="#" class="hover:text-lime-400 transition">Competition</a>
      <a href="/" class="hover:text-lime-400 transition">Home</a>
    </div>
    <a href="{% url 'login' %}" class="bg-lime-400 text-indigo-900 font-medium px-5 py-2 rounded-full hover:scale-105 transition">
      Login
    </a>
  </nav>

  <!-- Main Container -->
  <div class="flex flex-col items-center justify-center min-h-[calc(100vh-8rem)] px-6 md:px-0 relative">
    <div class="absolute inset-0 bg-black/40 -z-10"></div>

    <!-- Title -->
    <h1 class="text-6xl md:text-8xl font-[League_Gothic] mb-10 text-center">REGISTER</h1>

    <!-- Register Form -->
    <form id="register-form"
          class="bg-indigo-900/80 backdrop-blur-sm border border-lime-400 rounded-3xl shadow-2xl w-full max-w-lg p-8 md:p-12">
      {% csrf_token %}
      <div class="mb-6">
        <label class="block text-lime-400 text-xl font-[Geologica] mb-2">Username</label>
        <input type="text" name="username" required
               class="w-full h-12 bg-indigo-900 border-2 border-lime-400 rounded-[30px] text-white text-lg px-5 focus:outline-none focus:ring-2 focus:ring-lime-300">
      </div>

      <div class="mb-6">
        <label class="block text-lime-400 text-xl font-[Geologica] mb-2">Email</label>
        <input type="email" name="email" required
               class="w-full h-12 bg-indigo-900 border-2 border-lime-400 rounded-[30px] text-white text-lg px-5 focus:outline-none focus:ring-2 focus:ring-lime-300">
      </div>

      <div class="mb-6">
        <label class="block text-lime-400 text-xl font-[Geologica] mb-2">Password</label>
        <input type="password" name="password" required
               class="w-full h-12 bg-indigo-900 border-2 border-lime-400 rounded-[30px] text-white text-lg px-5 focus:outline-none focus:ring-2 focus:ring-lime-300">
      </div>

      <div class="mb-10">
        <label class="block text-lime-400 text-xl font-[Geologica] mb-2">Konfirmasi Password</label>
        <input type="password" name="confirm_password" required
               class="w-full h-12 bg-indigo-900 border-2 border-lime-400 rounded-[30px] text-white text-lg px-5 focus:outline-none focus:ring-2 focus:ring-lime-300">
      </div>

      <button type="submit"
              class="w-full bg-lime-400 text-indigo-900 text-2xl font-[Geologica] py-3 rounded-[36px] hover:scale-105 transition-transform">
        Daftar
      </button>

      <p class="mt-6 text-center text-lime-400 text-lg font-[Geologica]">
        Sudah punya akun?
        <a href="{% url 'login' %}" class="underline hover:text-lime-300">Login di sini</a>
      </p>
    </form>
  </div>

  <!-- Footer -->
  <footer class="bg-lime-400 py-4 mt-10 text-center">
    <p class="text-indigo-900 font-[Geologica] text-sm md:text-base">© 2025 Beyond90 — PBP-11</p>
  </footer>

  <!-- AJAX Script -->
  <script>
  document.getElementById("register-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);

    const response = await fetch("{% url 'register' %}", {
      method: "POST",
      headers: { "X-Requested-With": "XMLHttpRequest" },
      body: formData
    });

    const data = await response.json();

    if (data.success) {
      Swal.fire({
        icon: "success",
        title: "Berhasil!",
        text: data.message,
        confirmButtonColor: "#84cc16"
      }).then(() => {
        window.location.href = data.redirect_url;
      });
    } else {
      Swal.fire({
        icon: "error",
        title: "Gagal!",
        text: data.message || "Terjadi kesalahan. Coba lagi ya!",
        confirmButtonColor: "#ef4444"
      });
    }
  });
  </script>
</body>
</html>
